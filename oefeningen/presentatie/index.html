# Onder de Wilg

### Mijn persoonlijke Digital Garden

Mijn Digital Garden gaat over perspectieven die ik tegenkom in boeken, films, gesprekken en mijn journal, en hoe die mijn manier van denken beïnvloeden.

---

# Waarom heb ik dit onderwerp gekozen?

Ik heb dit onderwerp gekozen omdat ik het interessant vind om te zien hoe verschillende perspectieven invloed kunnen hebben op mijn manier van denken.

Soms kan één zin, scène, boek of ervaring ervoor zorgen dat ik anders naar iets kijk.

Ik vind het interessant om die verschillende invloeden te verzamelen en later terug te kunnen zien welke ideeën mij zijn bijgebleven.

Voor mij gaat dit onderwerp daarom niet alleen over persoonlijke groei, maar vooral over hoe perspectief kan veranderen.

---

# Wat is mijn doel?

Mijn doel is niet om anderen te overtuigen.

Ik wil vooral verzamelen welke perspectieven mij bijblijven en onderzoeken wat voor effect ze op mijn eigen gedachten hebben.

---

# Wat is de essentie?

De essentie van mijn onderwerp is:

### perspectief, reflectie en verandering

Soms verandert een situatie niet, maar een nieuw perspectief kan ervoor zorgen dat je er anders naar kijkt.

---

# Waarom groen en de wilg?

Ik gebruik groen en de wilg als visueel thema, omdat groen mij doet denken aan:

- groei
- ontwikkeling
- vernieuwing
- verandering

De wilg past bij mijn onderwerp omdat een boom ook blijft groeien en steeds nieuwe takken krijgt.

---

# Welke uitstraling past erbij?

Ik wil een rustige, natuurlijke en reflectieve uitstraling.

De sfeer moet zacht en open zijn, met veel groen, natuurlijke vormen en ruimte.

### Woorden die erbij passen:

- reflectief
- nieuwsgierig
- rustig
- open
- groeiend
- persoonlijk

---

# Welke content wil ik gebruiken?

Ik wil werken met:

- afbeeldingen
- korte teksten
- boeken
- films
- journalfragmenten
- quotes

De beelden hoeven niet alleen uit te leggen wat ik bedoel, maar mogen ook een sfeer of gevoel laten zien.

---


# Mijn eigen inspiratie

Deze wilg is voor mij een persoonlijke inspiratiebron.

Ik heb hem in vier verschillende seizoenen gefotografeerd.
De boom verandert steeds mee met het seizoen: de bladeren, kleuren en sfeer zijn telkens anders.

Voor mij past dat goed bij groei, ontwikkeling en verandering.
